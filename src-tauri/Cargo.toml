[package]
name = "torrenta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Torrenta — лёгкий торрент-клиент (Rust + Tauri 2)"

[lib]
name = "torrenta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "torrenta"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
torrent-core = { path = "../crates/torrent-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Реестр Windows напрямую: самолечение ассоциации .torrent-файлов
# (см. src/association.rs). Крейт уже был в графе зависимостей через Tauri,
# поэтому новых пакетов в Cargo.lock не появляется — только набор features.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }
