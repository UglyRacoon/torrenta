[workspace]
resolver = "2"
members = ["crates/torrent-core", "src-tauri"]

[workspace.package]
version = "1.6.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["Torrenta contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }

# Оптимизация релизной сборки: LTO + один codegen-unit дают самый быстрый
# рантайм и меньший размер, strip убирает символы, panic=abort уменьшает
# размер и убирает таблицы раскрутки стека.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
incremental = false

# Профиль для быстрых итераций: зависимости собраны с оптимизацией,
# наш код — без (быстрая пересборка).
[profile.dev]
opt-level = 0
